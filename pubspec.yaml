name: local_ledger
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  google_fonts: ^9.0.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  cryptography: ^2.9.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  flutter_adaptive_scaffold: ^0.3.3+1
  go_router: ^18.0.2
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  uuid: ^4.6.0
  local_auth: ^3.0.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  another_telephony: ^0.4.1
  permission_handler: ^13.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  flutter_svg: ^2.3.0
  simple_icons: ^16.23.0
  in_app_update: ^5.0.0
  showcaseview: 5.1.0
  flutter_email_sender: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_master.png"
  adaptive_icon_background: "#E2E6EA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/web_icon.png"
    background_color: "#F8FAFC"
    theme_color: "#111111"

# Native launch screen (shown before Flutter draws its first frame).
flutter_native_splash:
  color: "#F8FAFC"
  image: assets/icon/splash_mark.png
  android_12:
    color: "#F8FAFC"
    image: assets/icon/icon_foreground.png
    icon_background_color: "#E2E6EA"



# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icons/nav/
    - assets/icons/daypart/
    - assets/brand/
    - assets/logos/
    - assets/illustrations/
