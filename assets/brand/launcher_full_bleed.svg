<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <rect width="512" height="512" fill="#E2E6EA"/>
  <g transform="translate(256 256) scale(1.08) translate(-255.5 -250.5)">
<!-- Safe Feet / Legs -->
  <rect x="156" y="380" width="34" height="28" rx="8" fill="#111111"/>
  <rect x="322" y="380" width="34" height="28" rx="8" fill="#111111"/>

  <!-- Left Hinges (Light Sky Blue) -->
  <rect x="108" y="162" width="16" height="38" rx="5" fill="#88D1F1"/>
  <rect x="108" y="300" width="16" height="38" rx="5" fill="#88D1F1"/>

  <!-- Safe Main Box (Thick Black Border, Light Grey Interior) -->
  <rect x="120" y="104" width="272" height="282" rx="36" fill="#DCE1E6" stroke="#111111" stroke-width="22"/>

  <!-- Center-Left Gear / Spoke Safe Dial -->
  <g id="safe-dial">
    <!-- 8 Gear Spokes -->
    <circle cx="218" cy="245" r="48" fill="none" stroke="#111111" stroke-width="14" stroke-dasharray="10 27.7" stroke-linecap="round"/>
    
    <!-- Central Dial Wheel -->
    <circle cx="218" cy="245" r="32" fill="#111111"/>
    
    <!-- Inner White Core -->
    <circle cx="218" cy="245" r="12" fill="#FFFFFF"/>
  </g>

  <!-- Right Keyhole (Light Sky Blue) -->
  <g id="keyhole" fill="#88D1F1">
    <circle cx="332" cy="235" r="14"/>
    <path d="M 324 238 L 340 238 L 338 266 A 6 6 0 0 1 326 266 Z"/>
  </g>
  </g>
</svg>
